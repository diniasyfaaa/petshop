<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Sistem - Dini's Petshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h4>Dini’s Petshop - Dashboard Sistem</h4>
      <div>
        <span id="adminName"></span>
        <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="container my-5">
    <h5 class="mb-4">Statistik & Pengaturan Sistem</h5>
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="card text-bg-primary mb-3">
          <div class="card-body">
            <h6 class="card-title">Total Pengguna Terdaftar</h6>
            <h3 id="totalUser">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-bg-success mb-3">
          <div class="card-body">
            <h6 class="card-title">Login Hari Ini</h6>
            <h3 id="loginHariIni">3</h3> <!-- contoh -->
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h5>Manajemen Pengguna</h5>
        <table class="table table-bordered mt-3">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Username</th>
              <th>Role</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="userTable">
            <!-- Data user dari localStorage -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // Proteksi: hanya admin system boleh akses
    const role = localStorage.getItem("role");
    if (role !== "admin") {
      alert("Anda tidak punya akses ke halaman ini.");
      window.location.href = "login.html";
    }

    // Set nama admin
    const nama = localStorage.getItem("nama");
    document.getElementById("adminName").textContent = `👤 ${nama}`;

    // Ambil dan tampilkan user dari localStorage
    const userTable = document.getElementById("userTable");
    const userList = JSON.parse(localStorage.getItem("users")) || [];

    document.getElementById("totalUser").textContent = userList.length;

    userList.forEach((user, index) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${user.nama}</td>
        <td>${user.username}</td>
        <td>${user.role}</td>
        <td>
          <button class="btn btn-sm btn-danger" onclick="hapusUser(${index})">Hapus</button>
        </td>
      `;
      userTable.appendChild(tr);
    });

    function hapusUser(index) {
      if (confirm("Yakin ingin menghapus pengguna ini?")) {
        userList.splice(index, 1);
        localStorage.setItem("users", JSON.stringify(userList));
        location.reload();
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>

  <!-- Sticky Keranjang -->
<div id="stickyCart" onclick="window.location.href='cart.html'">
    🛒
    <span id="stickyCartCount">0</span>
  </div>
  
  <style>
    #stickyCart {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #212529; /* Warna seperti navbar bg-dark */
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%; /* Lingkaran penuh */
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
      position: fixed;
    }
  
    #stickyCart:hover {
      transform: scale(1.1);
    }
  
    #stickyCart span {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: red;
      color: white;
      padding: 2px 6px;
      border-radius: 50%;
      font-size: 12px;
      line-height: 1;
    }
  </style>
  

</body>
</html>
