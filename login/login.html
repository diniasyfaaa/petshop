<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Login pengguna Dini's Petshop">

  <title>Login - Dini's Petshop</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <header class="home-navbar sticky-top">
    <div class="container d-flex justify-content-between align-items-center">

      <a href="../index.html" class="home-brand">
        <span>🐾</span>
        Dini’s Petshop
      </a>

      <nav class="home-navigation">

        <a href="../index.html">
          Beranda
        </a>

        <a href="../katalog/produk.html">
          Produk
        </a>

        <a href="login.html" class="active">
          Login
        </a>

        <a href="../register/register.html" class="register-button">
          Registrasi
        </a>

      </nav>

    </div>
  </header>

  <main class="login-page">

    <div class="login-overlay"></div>

    <div class="container position-relative">

      <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-5">

          <div class="login-card">

            <div class="text-center mb-4">

              <div class="login-icon">
                🐾
              </div>

              <h1>
                Selamat Datang
              </h1>

              <p>
                Masuk ke akun Dini’s Petshop Anda.
              </p>

            </div>

            <div
              id="loginMessage"
              class="login-message d-none"
              role="alert">
            </div>

            <form id="loginForm">

              <div class="mb-3">

                <label
                  for="nama"
                  class="form-label">
                  Nama
                </label>

                <input
                  type="text"
                  class="form-control login-input"
                  id="nama"
                  placeholder="Dini Asyfa"
                  autocomplete="name"
                  required>

              </div>

              <div class="mb-3">

                <label
                  for="username"
                  class="form-label">
                  Username
                </label>

                <input
                  type="text"
                  class="form-control login-input"
                  id="username"
                  placeholder="diniasyfaaa"
                  autocomplete="username"
                  required>

              </div>

              <div class="mb-3">

                <label
                  for="password"
                  class="form-label">
                  Password
                </label>

                <div class="password-wrapper">

                  <input
                    type="password"
                    class="form-control login-input"
                    id="password"
                    placeholder="PemrogramanWeb1"
                    autocomplete="current-password"
                    required>

                  <button
                    type="button"
                    id="togglePassword"
                    class="password-toggle"
                    aria-label="Tampilkan password">
                    Lihat
                  </button>

                </div>

              </div>

              <div class="mb-4">

                <label
                  for="role"
                  class="form-label">
                  Login sebagai
                </label>

                <select
                  class="form-select login-input"
                  id="role"
                  required>
                  <option value="pelanggan">
                    Pelanggan
                  </option>

                  <option value="kasir">
                    Kasir
                  </option>

                  <option value="admin">
                    Admin System
                  </option>
                </select>

              </div>

              <button
              <a href="../katalog/produk.html"
                class="login-button">Masuk</a>
              </button>

            </form>

            <p class="login-register-text">
              Belum mempunyai akun?

              <a href="../register/register.html">
                Daftar sekarang
              </a>
            </p>

          </div>

        </div>

      </div>

    </div>

  </main>

  <a
    href="../cart/cart.html"
    id="stickyCart"
    aria-label="Buka keranjang belanja">
    <span class="sticky-cart-icon">
      🛒
    </span>

    <span id="stickyCartCount">
      0
    </span>
  </a>

  <script src="login.js"></script>

</body>
</html>
