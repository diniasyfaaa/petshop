<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"/>

  <meta
    name="description"
    content="Halaman Produk Dini's Petshop - tempat belanja kebutuhan hewan peliharaan Anda!"/>

  <title>Produk - Dini's Petshop</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"/>

  <link rel="stylesheet" href="produk.css" />
</head>

<body>
<nav class="navbar navbar-expand-lg product-navbar sticky-top">
  <div class="container">

    <a
      class="home-brand"
      href="../index.html">
        <span>🐾</span>
        Dini’s Petshop
      </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#productNavbar"
      aria-controls="productNavbar"
      aria-expanded="false"
      aria-label="Buka navigasi">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      class="collapse navbar-collapse"
      id="productNavbar">

      <div class="navbar-nav ms-lg-4 me-auto">
      </div>

      <div class="product-navbar-tools">

        <div class="product-search-wrapper">
          <span class="product-search-icon">
          </span>

          <input
            type="text"
            id="searchInput"
            placeholder="Cari nama atau merek produk..."
            class="form-control product-search-input"/>
        </div>

        <select
          id="sortBy"
          class="form-select product-filter-select"
          aria-label="Filter dan urutkan produk">
          <option value="all">
            Semua Produk
          </option>

          <optgroup label="Harga">
            <option value="harga-asc">
              Harga Termurah
            </option>

            <option value="harga-desc">
              Harga Termahal
            </option>
          </optgroup>

          <optgroup label="Merek">
            <option value="Cat Choize">
              Cat Choize
            </option>

            <option value="Whiskas">
              Whiskas
            </option>

            <option value="Me-O">
              Me-O
            </option>
          </optgroup>

          <optgroup label="Ukuran">
            <option value="ukuran-asc">
              Ukuran Terkecil
            </option>

            <option value="ukuran-desc">
              Ukuran Terbesar
            </option>
          </optgroup>
        </select>

      </div>

    </div>
  </div>
</nav>

  <main class="container my-5">

    <div class="mb-4">
      <h1 class="h3 mb-2">
        Produk Kami
      </h1>

      <p class="text-muted mb-0">
        Temukan kebutuhan terbaik untuk hewan peliharaan Anda.
      </p>
    </div>

    <div
      class="row g-4"
      id="productContainer"
    ></div>

  </main>

  <a
    href="../cart/cart.html"
    id="stickyCart"
    aria-label="Buka keranjang belanja">
    <span class="sticky-cart-icon">
      🛒
    </span>

    <span id="stickyCartCount">
      0
    </span>
  </a>

  <div
  id="cartToast"
  class="cart-toast"
  role="status"
  aria-live="polite">
  Produk berhasil ditambahkan ke keranjang.
</div>

<script src="produk.js"></script>

</body>
</html>
