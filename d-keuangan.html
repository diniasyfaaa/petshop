<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Keuangan - Dini's Petshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h4>Dini’s Petshop - Dashboard Keuangan</h4>
      <div>
        <span id="kasirName"></span>
        <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="container my-5">
    <div class="row mb-4">
      <div class="col">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5>Total Penjualan Hari Ini</h5>
            <h3 id="totalHariIni">Rp0</h3>
          </div>
        </div>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary mt-4" onclick="cetakLaporan()">Cetak Laporan</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h5>Transaksi Terakhir</h5>
        <ul class="list-group" id="transaksiList">
          <!-- Transaksi akan muncul di sini -->
        </ul>
      </div>
    </div>
  </main>

  <script>
    // Proteksi: hanya kasir boleh akses
    const role = localStorage.getItem("role");
    if (role !== "kasir") {
      alert("Anda tidak punya akses ke halaman ini.");
      window.location.href = "login.html";
    }

    // Set nama kasir
    const nama = localStorage.getItem("nama");
    document.getElementById("kasirName").textContent = `👤 ${nama}`;

    // Simulasi data transaksi (nanti bisa diambil dari server/database)
    const transaksiHariIni = [
      { nama: "Cat Choize Tuna", qty: 2, total: 13000 },
      { nama: "Me-O Tuna Kitten", qty: 1, total: 8000 },
      { nama: "Whiskas Mackerel Junior", qty: 3, total: 23100 },
    ];

    // Tampilkan transaksi
    const list = document.getElementById("transaksiList");
    let totalAll = 0;
    transaksiHariIni.forEach(tx => {
      const li = document.createElement("li");
      li.className = "list-group-item d-flex justify-content-between align-items-center";
      li.innerHTML = `
        ${tx.nama} x${tx.qty}
        <span>Rp${tx.total.toLocaleString("id-ID")}</span>
      `;
      list.appendChild(li);
      totalAll += tx.total;
    });

    // Tampilkan total
    document.getElementById("totalHariIni").textContent = `Rp${totalAll.toLocaleString("id-ID")}`;

    // Tombol cetak
    function cetakLaporan() {
      window.print(); // Atau arahkan ke halaman cetak
    }

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>

<!-- Sticky Keranjang -->
<div id="stickyCart">
    🛒
    <span id="stickyCartCount">0</span>
  </div>
  
  <style>
    #stickyCart {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #212529; /* Warna seperti navbar bg-dark */
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%; /* Lingkaran penuh */
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
      position: fixed;
    }
  
    #stickyCart:hover {
      transform: scale(1.1);
    }
  
    #stickyCart span {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: red;
      color: white;
      padding: 2px 6px;
      border-radius: 50%;
      font-size: 12px;
      line-height: 1;
    }
  </style>
  

</body>
</html>
